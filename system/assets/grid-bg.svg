<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a1a1a" stroke-width="0.5"></path>
    </pattern>
    <pattern id="grid-maj" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#242424" stroke-width="0.5"></path>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="#0a0a0a"></rect>
  <rect width="400" height="400" fill="url(#grid)"></rect>
  <rect width="400" height="400" fill="url(#grid-maj)"></rect>
</svg>